name: CI

on:
  push:
    branches:
      - master
      - audit/java-26.3
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  Lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: npm-shrinkwrap.json
    - run: npm ci --ignore-scripts
    - run: npm run lint

  Unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json
      - run: npm ci --ignore-scripts
      - run: npm run test:unit
      - run: npm run test:types
  
  PrepareSupportedVersions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: 24
    - id: set-matrix
      run: |
        node -e "
          const v = require('./lib/version').testedVersions;
          const groups = [];
          const SIZE = 4;
          for (let i = 0; i < v.length; i += SIZE) {
            groups.push({ versions: v.slice(i, i + SIZE).join(' ') });
          }
          console.log('matrix='+JSON.stringify({'include': groups}))
        " >> $GITHUB_OUTPUT

  MinecraftServer:
    needs: PrepareSupportedVersions
    runs-on: ubuntu-latest
    name: MC ${{ matrix.versions }}
    strategy:
      matrix: ${{ fromJson(needs.PrepareSupportedVersions.outputs.matrix) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          java-package: jre
      - name: Install Dependencies
        run: npm ci --ignore-scripts
      - name: Cache vanilla server jars
        uses: actions/cache@v4
        with:
          path: server_jars
          key: server-jars-${{ runner.os }}-${{ matrix.versions }}

      # Per-test durations from the last master run of this version group, so a PR gets a
      # comment listing tests it made more than 2x slower (test/common/compareDurations.js).
      - name: Restore duration baseline
        uses: actions/cache/restore@v4
        with:
          path: durations
          key: durations-${{ strategy.job-index }}-${{ github.sha }}
          restore-keys: durations-${{ strategy.job-index }}-
      - run: |
          mv durations baseline 2>/dev/null || mkdir -p baseline
          mkdir -p durations

      - name: Start Tests
        run: |
          exit_code=0
          pids=""
          for v in ${{ matrix.versions }}; do
            # TRACE is cheap (<1% runtime) and only written by the harness bot,
            # so always record a packet trace for post-mortem analysis.
            (result=0; MC_VERSION="$v" TRACE="trace-${v}.jsonl" DURATIONS="durations/durations-${v}.json" npm run mocha_test -- test/internalTest.js test/externalTest.js --retries 1 > "test-${v}.log" 2>&1 || result=$?; echo "$result" > "test-${v}.exit"; exit "$result") &
            pids="$pids $!"
          done
          for pid in $pids; do
            wait $pid || exit_code=$?
          done
          # Print passing versions first, then failing versions last
          for v in ${{ matrix.versions }}; do
            if [ "$(cat "test-${v}.exit" 2>/dev/null)" = "0" ]; then
              echo ""
              echo "=========================================="
              echo "  Results for Minecraft ${v}"
              echo "=========================================="
              cat "test-${v}.log"
            fi
          done
          for v in ${{ matrix.versions }}; do
            if [ "$(cat "test-${v}.exit" 2>/dev/null)" != "0" ]; then
              echo ""
              echo "=========================================="
              echo "  FAILED: Minecraft ${v}"
              echo "=========================================="
              cat "test-${v}.log"
            fi
          done
          # Only the failing versions' logs and packet traces are uploaded,
          # so artifact storage stays small; they auto-expire quickly too.
          mkdir -p artifacts
          for v in ${{ matrix.versions }}; do
            if [ "$(cat "test-${v}.exit" 2>/dev/null)" != "0" ]; then
              cp "test-${v}.log" artifacts/
              cp "trace-${v}.jsonl" artifacts/ 2>/dev/null || true
            fi
          done
          exit $exit_code

      - name: Compare test durations against master
        run: |
          mkdir -p slower
          echo "${{ github.event.pull_request.number }}" > slower/pr
          node test/common/compareDurations.js baseline durations "slower/${{ strategy.job-index }}.txt"

      # Fork PRs get a read-only token, so the comment is posted by
      # duration-comment.yml from this artifact instead of from here.
      - name: Upload slower tests for the PR comment
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: slower-${{ strategy.job-index }}
          path: slower

      - name: Save duration baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4
        with:
          path: durations
          key: durations-${{ strategy.job-index }}-${{ github.sha }}

      - name: Upload failed versions' logs and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failing-versions-${{ strategy.job-index }}
          path: artifacts/
          retention-days: 7

  Required:
    if: always()
    needs: [Lint, Unit, PrepareSupportedVersions, MinecraftServer]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks
        env:
          RESULTS: ${{ toJson(needs) }}
        run: |
          node -e 'const jobs=JSON.parse(process.env.RESULTS); if (Object.values(jobs).some(job => job.result !== "success")) process.exit(1)'
